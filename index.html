<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#151a25"><meta name="description" content="Primal KnIght - Onslaught: A one-hero fortress defense RPG featuring auto-combat, gear, runes and endless upgrades."><title>Primal KnIght - Onslaught</title><link rel="icon" href="assets/icon.png"><link rel="apple-touch-icon" href="assets/icon.png"><link rel="stylesheet" href="style.css?v=0.2"></head>
<body>
<div id="app">
 <header class="top"><div class="branding"><div class="emblem">✦</div><div><div class="brand">PRIMAL KNIGHT</div><div class="subtitle">ONSLAUGHT <span class="version">ALPHA 0.2</span></div></div></div><div class="resources" id="resources"></div><button class="tiny-icon" id="settingsButton" aria-label="Settings">⚙</button></header>
 <div class="game-shell">
   <div class="battlefield" id="battlefield"><canvas id="game" width="960" height="540" aria-label="Animated fortress battle"></canvas><div class="hud-top"><div class="hudbox"><span class="small">THE VERDANT MARCH</span><strong id="stageName">Forest Front • Stage 1</strong></div><div class="hudbox center"><span class="small">INCOMING WAVE</span><strong id="waveName">WAVE 1 / 10</strong><div class="wave-track"><div id="waveFill"></div></div></div><div class="hudbox right"><span class="small">FORTRESS INTEGRITY</span><strong id="wallText">100 / 100</strong><div class="hp-track"><div id="wallFill"></div></div></div></div>
    <div class="hero-tag" id="heroTag">✦ LEVEL 1 <span>0 / 80 XP</span></div><div class="combat-msg" id="combatMessage">THE SIEGE AWAITS</div>
    <div class="fight-actions"><button id="startButton" class="action-primary">⚔ BEGIN SIEGE</button><button id="speedButton" class="action-secondary" title="Battle speed">1×</button><button id="pauseButton" class="action-secondary" title="Pause">Ⅱ</button></div>
   </div>
   <section class="panel" id="panel" aria-label="Upgrade screen" hidden><div class="panel-head"><div><p id="panelEyebrow">YOUR HERO</p><h1 id="panelTitle">HERO</h1></div><button id="closePanel">✕</button></div><div id="panelContent"></div></section>
 </div>
 <footer class="nav" id="nav"><button class="nav-item selected" data-tab="battle"><span>⚔</span><b>BATTLE</b></button><button class="nav-item" data-tab="hero"><span>♜</span><b>HERO</b></button><button class="nav-item" data-tab="skills"><span>✧</span><b>SKILLS</b></button><button class="nav-item" data-tab="equipment"><span>🛡</span><b>GEAR</b></button><button class="nav-item" data-tab="runes"><span>◇</span><b>RUNES</b></button><button class="nav-item" data-tab="stations"><span>♙</span><b>STATIONS</b></button><button class="nav-item" data-tab="research"><span>⚗</span><b>RESEARCH</b></button><button class="nav-item" data-tab="training"><span>⬆</span><b>TRAINING</b></button><button class="nav-item" data-tab="suppression"><span>☠</span><b>SUPPRESS</b></button></footer>
 <div class="toast" id="toast" role="status"></div>
</div><script src="game.js?v=0.2"></script></body></html>
