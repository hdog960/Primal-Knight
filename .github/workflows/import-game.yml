name: Primal KnIght - Onslaught quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Verify game and progression
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify required game and art files
        run: |
          test -f index.html
          test -f style.css
          test -f game.js
          test -f assets/battlefield.png
          test -f assets/hero.png
          test -f assets/goblin.png
          test -f assets/guardian.svg
          test -f assets/raider.svg
          test -f assets/shaman.svg
          test -f assets/siegebeast.svg
          test -f assets/warlord.svg
          test -f assets/thornweaver.svg
          test -f assets/riftstalker.svg
          test -f assets/warlord_iron.svg
          test -f assets/warlord_ember.svg
          test -f assets/warlord_rift.svg

      - name: Validate JavaScript and gameplay
        run: |
          node --check game.js
          node tests/smoke.js
          node tests/balance.js
          node tests/encounters.js
          node tests/deepwave.js
          node tests/mobile-render.js
          node tests/reward-integrity.js
          node tests/first-watch-vault.js
          node tests/siege-chronicle.js
          node tests/boss-fairness.js
          node tests/hero-doctrines.js
          node tests/combat-builds.js
          node tests/war-council.js
          node tests/combat-balance-matrix.js
          node tests/progression-matched-builds.js
          node tests/quartermaster.js
          node tests/earned-first-watch.js
          node tests/earned-retries.js
          node tests/sigil-ledger.js
          node tests/war-chest.js
          node tests/sigil-gated-combat.js
          node tests/doctrine-tactics.js
          node tests/doctrine-tactic-battles.js
          node tests/doctrine-telemetry.js
          node tests/territory-atmosphere.js
          node tests/territory-scenes.js
          node tests/territory-preview.js
          node tests/territory-relics.js
          node tests/territory-heraldry.js
          node tests/world-atlas.js
          node tests/atlas-art-compare.js
          node tests/three-banner-cohesion.js
          node tests/adaptive-mobile-render.js
          node tests/atlas-inspection.js
          node tests/atlas-pinch.js
          node tests/device-perf.js
          node tests/visual-quality.js
          node tests/realm-weather.js
          node tests/specialist-alerts.js
          node tests/battlefield-snapshot.js
          node tests/boss-stage-art.js
          node tests/atlas-boss-inspection.js
          node tests/atlas-image-export.js
          node tests/atlas-weather-preview.js
          node tests/low-allocation-combat.js
          node tests/native-vanguards.js
          node tests/native-formations.js
          node tests/long-siege-allocation.js
          node tests/iphone-endurance.js
          node tests/breach-readability.js
          node tests/cast-focus-beacons.js
          node tests/tactical-contrast-lens.js
          node tests/lens-comparison.js
          node tests/lost-signals.js
          node tests/secret-guardians-bonds.js
          node tests/cartographer-oath.js
          node tests/ancestral-keepsakes.js
          node tests/echo-returns.js
          node tests/atlas-seals.js
          node tests/scout-routebook.js
          node tests/save-checkpoint-recovery.js
          node tests/siege-history.js
