name: Primal KnIght - Onslaught quality checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Verify game and progression
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify required game and art files
        run: |
          test -f index.html
          test -f style.css
          test -f game.js
          test -f assets/battlefield.png
          test -f assets/hero.png
          test -f assets/goblin.png

      - name: Validate JavaScript and gameplay
        run: |
          node --check game.js
          node tests/smoke.js
          node tests/balance.js
