name: Alpha 0.15.21 one-time version sync
on:
  push:
    branches:
      - dev/alpha-01521-battle-plan-ledger
    paths:
      - .github/workflows/alpha-01521-version-sync.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/alpha-01521-battle-plan-ledger
          persist-credentials: true
      - name: Align game, iPhone asset URLs and regression versions atomically
        run: |
          python3 - <<'PY'
          from pathlib import Path
          game=Path('game.js')
          source=game.read_text()
          assert 'Alpha 0.15.20' in source
          game.write_text(source.replace('Alpha 0.15.20','Alpha 0.15.21',1))
          index=Path('index.html')
          html=index.read_text()
          assert 'ALPHA 0.15.20' in html and 'style.css?v=0.15.20' in html and 'game.js?v=0.15.20' in html
          index.write_text(html.replace('ALPHA 0.15.20','ALPHA 0.15.21').replace('style.css?v=0.15.20','style.css?v=0.15.21').replace('game.js?v=0.15.20','game.js?v=0.15.21'))
          files=0
          for file in Path('tests').glob('*.js'):
              content=file.read_text()
              if '0.15.20' in content:
                  file.write_text(content.replace('0.15.20','0.15.21'))
                  files+=1
          assert files>=20, f'Expected version-locked test suite; found {files} files'
          print('Aligned',files,'test scripts to Alpha 0.15.21')
          PY
      - name: Short version and actual-engine feature verification
        run: |
          node --check game.js
          node tests/first-watch-battle-plan-ledger.js
          node tests/first-watch-battle-plans.js
          node tests/smoke.js
      - name: Commit aligned release identifiers back to development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js index.html tests
          if ! git diff --cached --quiet; then
            git commit -m 'Alpha 0.15.21: sync version-pinned tests and iPhone cache keys'
            git push origin HEAD:dev/alpha-01521-battle-plan-ledger
          fi
