name: Alpha 0.15.20 regression-version alignment (one-time)
on:
  push:
    branches: [dev/alpha-01520-battle-plans]
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Align pre-existing exact release assertions without disabling any checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          edited=[]
          for file in sorted(Path('tests').glob('*.js')):
              before=file.read_text(encoding='utf-8')
              after=before.replace('0.15.19','0.15.20')
              if after!=before:
                  file.write_text(after,encoding='utf-8')
                  edited.append(str(file))
          print('Updated pinned release assertions:',len(edited))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          if ! git diff --cached --quiet; then
            git commit -m 'Alpha 0.15.20: preserve and synchronize pinned regression version assertions'
            git push origin HEAD:dev/alpha-01520-battle-plans
          fi
