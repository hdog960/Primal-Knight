name: Alpha 0.15.20 focused battle-plan QA (temporary)
on:
  push:
    branches: [dev/alpha-01520-battle-plans]
permissions:
  contents: read
jobs:
  plans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate original saves, battle plan choices and targeting
        shell: bash
        run: |
          node --check game.js
          node tests/siege-history.js
          node tests/first-watch-wallguard.js
          node tests/first-watch-battle-plans.js
