name: Alpha 0.15.27 temporary version alignment
on:
  push:
    branches: [dev/alpha-01527-pioneer-sweep]
    paths:
      - .github/workflows/alpha-01527-version-align.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/alpha-01527-pioneer-sweep
          persist-credentials: true
      - name: Align versioned source, iPhone caches, legacy tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('game.js');text=path.read_text()
          assert 'Alpha 0.15.26' in text
          path.write_text(text.replace('Alpha 0.15.26','Alpha 0.15.27',1))
          index=Path('index.html');html=index.read_text()
          for a,b in [('ALPHA 0.15.26','ALPHA 0.15.27'),
                      ('style.css?v=0.15.26','style.css?v=0.15.27'),
                      ('game.js?v=0.15.26','game.js?v=0.15.27')]:
              assert a in html
              html=html.replace(a,b)
          index.write_text(html)
          changed=0
          for file in Path('tests').glob('*.js'):
              text=file.read_text()
              if '0.15.26' in text:
                  file.write_text(text.replace('0.15.26','0.15.27'))
                  changed+=1
          assert changed>=20, f'Missing version-pinned test archive: {changed}'
          print('Aligned regression scripts:',changed)
          PY
      - name: Focused playable interaction, save and route checks
        run: |
          node --check game.js
          node tests/first-watch-pioneer-sweep.js
          node tests/first-watch-route-compass.js
          node tests/first-watch-record-yield.js
          node tests/first-watch-record-stretch.js
          node tests/smoke.js
      - name: Push versioned candidate after focused tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js index.html tests
          if ! git diff --cached --quiet; then
            git commit -m 'Alpha 0.15.27: QA-verified iPhone cache version and 96 regression assertions'
            git push origin HEAD:dev/alpha-01527-pioneer-sweep
          fi
