name: Alpha 0.15.19 narrow save and wave diagnostics (temporary)
on:
  push:
    branches: [dev/alpha-01519-wave-pressure]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check original game and targeted regression
        shell: bash
        run: |
          node --check game.js
          node tests/siege-history.js
          node tests/first-watch-wave-pressure.js
          node tests/first-watch-wallguard.js
