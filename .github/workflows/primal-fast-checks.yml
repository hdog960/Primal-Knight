name: Primal Knight fast gameplay regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Fast gameplay and save-contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check game.js
          node --check tests/first-watch-pioneer-sweep.js
      - name: Critical game and save regressions
        run: |
          node tests/cache-version-contract.js
          node tests/smoke.js
          node tests/battle-tier-keyboard.js
          node tests/save-live-continuity.js
          node tests/first-watch-pioneer-sweep.js
