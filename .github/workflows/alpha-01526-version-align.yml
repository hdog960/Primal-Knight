name: Alpha 0.15.26 one-time version alignment
on:
  push:
    branches: [dev/alpha-01526-watch-route-compass]
    paths:
      - .github/workflows/alpha-01526-version-align.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/alpha-01526-watch-route-compass
          persist-credentials: true
      - name: Align source, iPhone cache keys and all historical regression versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('game.js');code=src.read_text()
          assert 'Alpha 0.15.25' in code
          src.write_text(code.replace('Alpha 0.15.25','Alpha 0.15.26',1))
          idx=Path('index.html');html=idx.read_text()
          for old,new in [('ALPHA 0.15.25','ALPHA 0.15.26'),
                          ('style.css?v=0.15.25','style.css?v=0.15.26'),
                          ('game.js?v=0.15.25','game.js?v=0.15.26')]:
              assert old in html
              html=html.replace(old,new)
          idx.write_text(html)
          changed=0
          for file in Path('tests').glob('*.js'):
              script=file.read_text()
              if '0.15.25' in script:
                  file.write_text(script.replace('0.15.25','0.15.26'))
                  changed+=1
          assert changed>=20, f'Expected version-pinned historical tests; got {changed}'
          print('Aligned regression test files:',changed)
          PY
      - name: Run focused gameplay, iPhone and Veteran Watch checks
        run: |
          node --check game.js
          node tests/first-watch-route-compass.js
          node tests/first-watch-record-yield.js
          node tests/first-watch-record-stretch.js
          node tests/first-watch-clear-routes.js
          node tests/smoke.js
      - name: Persist version alignment after successful focused validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js index.html tests
          if ! git diff --cached --quiet; then
            git commit -m 'Alpha 0.15.26: synchronize verified iPhone cache version and 95 regressions'
            git push origin HEAD:dev/alpha-01526-watch-route-compass
          fi
