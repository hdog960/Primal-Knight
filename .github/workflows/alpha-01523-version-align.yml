name: Alpha 0.15.23 temporary release version alignment
on:
  push:
    branches: [dev/alpha-01523-dominion-arrival]
    paths:
      - .github/workflows/alpha-01523-version-align.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/alpha-01523-dominion-arrival
          persist-credentials: true
      - name: Synchronize versioned source, iPhone assets and full regression suite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('game.js')
          source=path.read_text()
          assert 'Alpha 0.15.22' in source
          path.write_text(source.replace('Alpha 0.15.22','Alpha 0.15.23',1))
          idx=Path('index.html')
          html=idx.read_text()
          for old,new in [('ALPHA 0.15.22','ALPHA 0.15.23'),('style.css?v=0.15.22','style.css?v=0.15.23'),('game.js?v=0.15.22','game.js?v=0.15.23')]:
              assert old in html
              html=html.replace(old,new)
          idx.write_text(html)
          n=0
          for file in Path('tests').glob('*.js'):
              text=file.read_text()
              if '0.15.22' in text:
                  file.write_text(text.replace('0.15.22','0.15.23'))
                  n+=1
          assert n>=20, 'Missing existing version-pinned tests'
          print('Versioned tests aligned:',n)
          PY
      - name: Focused Glassheart, original saved combat and navigation checks
        run: |
          node --check game.js
          node tests/first-watch-dominion-arrival.js
          node tests/first-watch-outer-frontier.js
          node tests/first-watch-battle-plan-ledger.js
          node tests/smoke.js
      - name: Commit synchronized version only after verified tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js index.html tests
          if ! git diff --cached --quiet; then
            git commit -m 'Alpha 0.15.23: synchronize verified iPhone version and 92-test suite'
            git push origin HEAD:dev/alpha-01523-dominion-arrival
          fi
