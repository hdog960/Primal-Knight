name: Build isolated menu icons
on:
  push:
    paths:
      - 'menu_art.py'
      - '.github/workflows/build-menu-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primal-knight-art-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build icon textures
        run: |
          python3 -m pip install Pillow
          python3 menu_art.py
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          icons = list(Path('assets/menu').glob('*.png'))
          assert len(icons) == 11, f'Expected 11 icons, got {len(icons)}'
          for f in icons:
              im = Image.open(f)
              assert im.size == (96,80) and im.mode == 'RGBA'
              assert im.getbbox()
          print('All menu textures verified')
          PY
      - name: Check gameplay
        run: |
          node --check game.js
          node tests/smoke.js
      - name: Commit isolated artwork to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/menu docs/menu_icon_contact.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add eleven isolated 32-bit styled menu icons'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
