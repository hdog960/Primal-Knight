name: Alpha 0.15.24 one-time version alignment
on:
  push:
    branches: [dev/alpha-01524-record-stretch]
    paths:
      - .github/workflows/alpha-01524-align.yml
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/alpha-01524-record-stretch
          persist-credentials: true
      - name: Update source, iPhone cache keys and pinned regression assertions together
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('game.js'); source=path.read_text()
          assert 'Alpha 0.15.23' in source
          path.write_text(source.replace('Alpha 0.15.23','Alpha 0.15.24',1))
          index=Path('index.html'); content=index.read_text()
          for old,new in [('ALPHA 0.15.23','ALPHA 0.15.24'),('style.css?v=0.15.23','style.css?v=0.15.24'),('game.js?v=0.15.23','game.js?v=0.15.24')]:
              assert old in content
              content=content.replace(old,new)
          index.write_text(content)
          aligned=0
          for file in Path('tests').glob('*.js'):
              code=file.read_text()
              if '0.15.23' in code:
                  file.write_text(code.replace('0.15.23','0.15.24'))
                  aligned+=1
          assert aligned>=20, f'Missing historic version-pinned tests; found {aligned}'
          print('Updated test scripts:',aligned)
          PY
      - name: Focused source and replay-route verification
        run: |
          node --check game.js
          node tests/first-watch-record-stretch.js
          node tests/first-watch-battle-plan-ledger.js
          node tests/smoke.js
      - name: Commit release identifiers only after tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js index.html tests
          if ! git diff --cached --quiet; then
            git commit -m 'Alpha 0.15.24: verified version assertions and iPhone asset cache keys'
            git push origin HEAD:dev/alpha-01524-record-stretch
          fi
