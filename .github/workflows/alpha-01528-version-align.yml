name: Alpha 0.15.28 temporary release alignment
on:
  push:
    branches: [dev/alpha-01528-pioneer-routebook]
    paths:
      - .github/workflows/alpha-01528-version-align.yml
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/alpha-01528-pioneer-routebook
          persist-credentials: true
      - name: Synchronize source, iPhone cache identifiers and versioned regression scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file=Path('game.js');code=file.read_text()
          assert 'Alpha 0.15.27' in code
          file.write_text(code.replace('Alpha 0.15.27','Alpha 0.15.28',1))
          idx=Path('index.html');html=idx.read_text()
          for a,b in [('ALPHA 0.15.27','ALPHA 0.15.28'),
                      ('style.css?v=0.15.27','style.css?v=0.15.28'),
                      ('game.js?v=0.15.27','game.js?v=0.15.28')]:
              assert a in html
              html=html.replace(a,b)
          idx.write_text(html)
          count=0
          for f in Path('tests').glob('*.js'):
              old=f.read_text()
              if '0.15.27' in old:
                  f.write_text(old.replace('0.15.27','0.15.28'))
                  count+=1
          assert count>=20, f'Historical version tests not aligned: {count}'
          print('Aligned test scripts:',count)
          PY
      - name: Check true game source and Pioneer Routebook interactive regression
        run: |
          node --check game.js
          node tests/first-watch-pioneer-routebook.js
          node tests/first-watch-pioneer-sweep.js
          node tests/first-watch-route-compass.js
          node tests/first-watch-record-yield.js
          node tests/smoke.js
      - name: Commit final source version only following actual test success
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js index.html tests
          if ! git diff --cached --quiet; then
            git commit -m 'Alpha 0.15.28: QA-verified iPhone cache keys and 97 regression versions'
            git push origin HEAD:dev/alpha-01528-pioneer-routebook
          fi
