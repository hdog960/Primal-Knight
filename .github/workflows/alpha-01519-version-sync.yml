name: Alpha 0.15.19 release assertion sync (one-time)
on:
  push:
    branches: [dev/alpha-01519-wave-pressure]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Align exact prior-version assertions with current release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=[]
          for file in sorted(Path('tests').glob('*.js')):
              old=file.read_text(encoding='utf-8')
              new=old.replace('0.15.18','0.15.19')
              if new!=old:
                  file.write_text(new,encoding='utf-8')
                  changed.append(str(file))
          print('Version assertions synchronized:',len(changed))
          print('\n'.join(changed))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          if ! git diff --cached --quiet; then
            git commit -m 'Alpha 0.15.19: synchronize release-version assertions in regression tests'
            git push origin HEAD:dev/alpha-01519-wave-pressure
          fi
